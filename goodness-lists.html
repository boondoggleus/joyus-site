<title>Goodness Lists — joy.us</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  :root{--navy:#16263F;--gold:#E2A23E;--blue:#2F5DFF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Poppins',system-ui,Arial,sans-serif;color:var(--navy);background:#fff;min-height:100vh;display:flex;flex-direction:column;}
  .site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,64px);background:#fff;box-shadow:0 6px 24px rgba(22,38,63,.08);}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo svg{width:30px;height:30px;}
  .logo span{font-size:24px;font-weight:700;color:var(--navy);}
  nav{display:flex;gap:clamp(16px,2.4vw,40px);}
  nav a{color:var(--navy);text-decoration:none;font-size:16px;font-weight:500;}
  nav a:hover,nav a.active{text-decoration:underline;text-underline-offset:5px;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:150px 24px 90px;}
  .kicker{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  main h1{font-size:clamp(30px,5vw,52px);font-weight:700;margin-bottom:14px;}
  main p{font-size:18px;color:#5a6b82;max-width:540px;line-height:1.6;}
  footer{background:#0e1b2e;color:#7d8ba3;text-align:center;padding:24px;font-size:13px;}
  footer .pledge{color:var(--gold);}
  @media(max-width:760px){nav{display:none;}}
</style>
</head>

    <div class="kicker">Coming soon</div>
